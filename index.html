<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Pilah Sampah</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:linear-gradient(to bottom,#87CEEB,#E0F7FA);
    text-align:center;
}

h1{
    margin-top:10px;
    color:#1b4332;
}

#info{
    display:flex;
    justify-content:center;
    gap:40px;
    font-size:22px;
    font-weight:bold;
    margin:10px;
}

#gameArea{
    position:relative;
    width:100vw;
    height:65vh;
}

.trash{
    position:absolute;
    width:80px;
    height:80px;
    font-size:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:grab;
    user-select:none;
    touch-action:none;
}

.bin-container{
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
    justify-content:space-around;
    padding:15px;
    background:#2d6a4f;
}

.bin{
    width:180px;
    height:160px;
    border-radius:20px;
    color:white;
    font-size:24px;
    font-weight:bold;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

#organic{
    background:#40916c;
}

#anorganic{
    background:#1d3557;
}

#gameOver{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:35px;
    border-radius:20px;
    display:none;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#2d6a4f;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1b4332;
}

@media(max-width:600px){

    .bin{
        width:140px;
        height:130px;
        font-size:20px;
    }

    .trash{
        width:70px;
        height:70px;
        font-size:50px;
    }

}

</style>
</head>

<body>

<h1>♻️ Game Pilah Sampah ♻️</h1>

<div id="info">
    <div>Skor: <span id="score">0</span></div>
    <div>Waktu: <span id="time">60</span></div>
</div>

<div id="gameArea"></div>

<div class="bin-container">

    <div class="bin" id="organic">
        🌿<br>ORGANIK
    </div>

    <div class="bin" id="anorganic">
        🧴<br>ANORGANIK
    </div>

</div>

<div id="gameOver">
    <h2>⏰ Waktu Habis!</h2>
    <h3 id="finalScore"></h3>
    <button onclick="location.reload()">Main Lagi</button>
</div>

<script>

const gameArea = document.getElementById("gameArea");
const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");
const finalScore = document.getElementById("finalScore");
const gameOverBox = document.getElementById("gameOver");

let score = 0;
let timeLeft = 60;
let gameEnded = false;

const trashItems = [
    {emoji:"🍌", type:"organic"},
    {emoji:"🍎", type:"organic"},
    {emoji:"🥬", type:"organic"},
    {emoji:"🧴", type:"anorganic"},
    {emoji:"🥫", type:"anorganic"},
    {emoji:"🛍️", type:"anorganic"}
];

function createTrash(){

    if(gameEnded) return;

    const trash = document.createElement("div");
    trash.className = "trash";

    const item = trashItems[Math.floor(Math.random()*trashItems.length)];

    trash.innerHTML = item.emoji;
    trash.dataset.type = item.type;

    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * 300;

    trash.style.left = x + "px";
    trash.style.top = y + "px";

    gameArea.appendChild(trash);

    let offsetX, offsetY;
    let dragging = false;

    function startDrag(clientX, clientY){

        dragging = true;

        offsetX = clientX - trash.offsetLeft;
        offsetY = clientY - trash.offsetTop;
    }

    function moveDrag(clientX, clientY){

        if(!dragging) return;

        trash.style.left = (clientX - offsetX) + "px";
        trash.style.top = (clientY - offsetY) + "px";
    }

    function endDrag(){

        dragging = false;

        checkBin(trash, item.type);
    }

    // MOUSE
    trash.addEventListener("mousedown", (e)=>{
        startDrag(e.clientX, e.clientY);
    });

    document.addEventListener("mousemove", (e)=>{
        moveDrag(e.clientX, e.clientY);
    });

    document.addEventListener("mouseup", ()=>{
        endDrag();
    });

    // TOUCH HP
    trash.addEventListener("touchstart", (e)=>{
        startDrag(e.touches[0].clientX, e.touches[0].clientY);
    });

    document.addEventListener("touchmove", (e)=>{
        moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    });

    document.addEventListener("touchend", ()=>{
        endDrag();
    });

}

function checkBin(trash, type){

    const organic = document.getElementById("organic").getBoundingClientRect();
    const anorganic = document.getElementById("anorganic").getBoundingClientRect();

    const trashRect = trash.getBoundingClientRect();

    let correct = false;

    // CEK ORGANIK
    if(
        trashRect.left < organic.right &&
        trashRect.right > organic.left &&
        trashRect.top < organic.bottom &&
        trashRect.bottom > organic.top
    ){

        if(type === "organic"){
            correct = true;
        }

        processResult(trash, correct);
    }

    // CEK ANORGANIK
    if(
        trashRect.left < anorganic.right &&
        trashRect.right > anorganic.left &&
        trashRect.top < anorganic.bottom &&
        trashRect.bottom > anorganic.top
    ){

        if(type === "anorganic"){
            correct = true;
        }

        processResult(trash, correct);
    }

}

function processResult(trash, correct){

    if(correct){
        score += 10;
    }else{
        score -= 5;
    }

    scoreText.innerText = score;

    trash.remove();
}

setInterval(createTrash, 1300);

const timer = setInterval(()=>{

    timeLeft--;

    timeText.innerText = timeLeft;

    if(timeLeft <= 0){

        clearInterval(timer);

        gameEnded = true;

        gameOverBox.style.display = "block";

        finalScore.innerHTML = "Skor Akhir: " + score;
    }

},1000);

</script>

</body>
</html>
